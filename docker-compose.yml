services:
  cms:
    container_name: cms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=skylab_cms;Username=skylab_cms;Password=${SKYLAB_CMS_DB_PASSWORD:-postgres}
      - ConnectionStrings__Redis=redis:6379,defaultDatabase=0
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      - Keycloak__Authority=https://e.yildizskylab.com/realms/e-skylab
      - Keycloak__Audience=skycms
    restart: unless-stopped
    networks:
      - skylab

networks:
  skylab:
    external: true
