services:
  cms:
    container_name: cms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=skylab_cms;Username=skylab_cms;Password=${SKYLAB_CMS_DB_PASSWORD:-postgres}
      - ConnectionStrings__Redis=redis:6379,defaultDatabase=0
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      - Keycloak__Authority=https://e.yildizskylab.com/realms/e-skylab
      - Keycloak__Audience=skycms
      - ACCOUNT_ACCESS_GATE_MODE=${ACCOUNT_ACCESS_GATE_MODE:-off}
      - ACCOUNT_ACCESS_REDIS_ENDPOINT=${ACCOUNT_ACCESS_REDIS_ENDPOINT:-}
      - ACCOUNT_ACCESS_REDIS_USERNAME=${ACCOUNT_ACCESS_REDIS_USERNAME:-}
      - ACCOUNT_ACCESS_REDIS_PASSWORD=${ACCOUNT_ACCESS_REDIS_PASSWORD:-}
      - ACCOUNT_ACCESS_REDIS_DATABASE=${ACCOUNT_ACCESS_REDIS_DATABASE:-}
      - ACCOUNT_ACCESS_REDIS_TLS=${ACCOUNT_ACCESS_REDIS_TLS:-}
      - ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT_MS=${ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT_MS:-200}
      - ACCOUNT_ACCESS_GATE_RETRY_AFTER_SECONDS=${ACCOUNT_ACCESS_GATE_RETRY_AFTER_SECONDS:-1}
    restart: unless-stopped
    networks:
      - skylab

networks:
  skylab:
    external: true
